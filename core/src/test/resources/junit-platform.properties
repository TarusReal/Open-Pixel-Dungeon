# Open Pixel Dungeon's game state (Dungeon, Actor, Random, GamesInProgress, ...) lives in
# static fields shared by the whole JVM. Running tests concurrently would let them stomp on
# each other's state. This is pinned explicitly rather than relying on JUnit's default, so a
# future global config change can't silently turn concurrency on for this project.
# See docs/testing.md.
junit.jupiter.execution.parallel.enabled=false
